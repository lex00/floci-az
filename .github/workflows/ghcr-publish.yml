name: GHCR Publish

# Fork automation: publishes ghcr.io/lex00/floci-az on every push to main and on
# version tag pushes, so the fork's fixes are pullable without waiting on a
# tagged release. Ported from the lex00/floci fork's ghcr-publish.yml. Builds
# amd64 and arm64 by digest on native runners, then merges them into one
# manifest list so both amd64 CI hosts and arm64 Macs can pull the result. Uses
# the standard GITHUB_TOKEN with packages: write - no additional secrets required.
#
# Published tags:
#   main push:  ghcr.io/lex00/floci-az:latest     ghcr.io/lex00/floci-az:<short-sha>
#   tag push:   ghcr.io/lex00/floci-az:<tag>      ghcr.io/lex00/floci-az:<short-sha>

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/floci-az

jobs:
  # Gate: the build/merge jobs below must not run unless the suite is green.
  # This duplicates ci.yml's test steps rather than chaining on its run
  # (workflow_run) or calling into it (workflow_call). ci.yml has no `tags:`
  # trigger and filters main pushes by path, so a workflow_run gate would never
  # fire for tag pushes or for main pushes outside src/ and pom.xml. A test job
  # in this workflow runs whichever trigger fired.
  # Cost accepted: the suite can run twice on a push to main (here and in
  # ci.yml) - this is a low-traffic fork merged in batches, so the CI-minutes
  # cost is worth never publishing red.
  test:
    name: Test suite (publish gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # Read-only: ci.yml is the repo's single writer of this key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run tests
        run: ./mvnw test -B

  build:
    name: build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Platform slug
        id: slug
        run: echo "value=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=floci-az-ghcr-publish-${{ steps.slug.outputs.value }}
          cache-to: type=gha,scope=floci-az-ghcr-publish-${{ steps.slug.outputs.value }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags for this push
        id: tags
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          tags="-t ${{ env.IMAGE }}:${short_sha}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${tags} -t ${{ env.IMAGE }}:${{ github.ref_name }}"
          else
            tags="${tags} -t ${{ env.IMAGE }}:latest"
          fi
          echo "flags=${tags}" >> "$GITHUB_OUTPUT"
          echo "primary=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.flags }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.tags.outputs.primary }}
